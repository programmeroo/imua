{% extends "base.html" %}
{% block content %}
<div class="cron-page">
    <header class="page-header">
        <div class="page-header-left">
            <h2>Cron Jobs</h2>
            <span class="subtitle">Scheduled Task Management</span>
        </div>
        <div class="page-header-right">
            <span class="badge">&#x25CF; Scheduler</span>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-top">
                <span class="stat-icon">&#x1F4C5;</span>
            </div>
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label">Total Jobs</span>
        </div>
        <div class="stat-card">
            <div class="stat-top">
                <span class="stat-icon">&#x1F7E2;</span>
            </div>
            <span class="stat-value" id="stat-active">0</span>
            <span class="stat-label">Active</span>
        </div>
        <div class="stat-card">
            <div class="stat-top">
                <span class="stat-icon">&#x23F8;</span>
            </div>
            <span class="stat-value" id="stat-paused">0</span>
            <span class="stat-label">Paused</span>
        </div>
        <div class="stat-card">
            <div class="stat-top">
                <span class="stat-icon">&#x274C;</span>
            </div>
            <span class="stat-value" id="stat-failed">0</span>
            <span class="stat-label">Failed</span>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <h3>Scheduled Jobs</h3>
            <span class="panel-badge" id="job-count">0 jobs</span>
        </div>
        <div class="table-wrapper">
            <table class="data-table" id="cron-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Schedule</th>
                        <th>Assigned To</th>
                        <th>Last Run</th>
                        <th>Next Run</th>
                        <th>Status</th>
                        <th>Success</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="cron-body">
                    <tr>
                        <td colspan="8" class="placeholder" style="text-align:center;padding:24px">Loading cron jobs...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/cron.js') }}"></script>
{% endblock %}
