{% extends "base.html" %}
{% block content %}
<div class="documents-page">
    <header class="page-header">
        <div class="page-header-left">
            <h2>Documents</h2>
            <span class="subtitle">Shared Document Store</span>
        </div>
        <div class="page-header-right">
            <span class="badge">&#x25CF; Live</span>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-top"><span class="stat-icon">&#x1F4C4;</span></div>
            <span class="stat-value" id="stat-total">0</span>
            <span class="stat-label">Total Documents</span>
        </div>
        <div class="stat-card">
            <div class="stat-top"><span class="stat-icon">&#x2705;</span></div>
            <span class="stat-value" id="stat-active">0</span>
            <span class="stat-label">Active</span>
        </div>
        <div class="stat-card">
            <div class="stat-top"><span class="stat-icon">&#x1F4E6;</span></div>
            <span class="stat-value" id="stat-archived">0</span>
            <span class="stat-label">Archived</span>
        </div>
    </div>

    <section class="panel">
        <div class="panel-header">
            <h3>Upload a Document</h3>
        </div>
        <form id="upload-form" class="invite-form" enctype="multipart/form-data">
            <input id="upload-file" class="form-input" type="file" required>
            <input id="upload-by" class="form-input" type="text" placeholder="uploaded by (e.g. akm)">
            <button type="submit" class="btn btn-primary">Upload</button>
        </form>
    </section>

    <div class="panel">
        <div class="panel-header">
            <h3>Stored Documents</h3>
            <div class="panel-actions">
                <select id="archived-filter" class="filter-input" style="width:auto;padding:4px 8px;font-size:12px;">
                    <option value="">All</option>
                    <option value="false">Active only</option>
                    <option value="true">Archived only</option>
                </select>
            </div>
        </div>
        <div class="table-wrapper">
            <table class="data-table" id="documents-table">
                <thead>
                    <tr>
                        <th>Filename</th>
                        <th>Size</th>
                        <th>Uploaded By</th>
                        <th>Uploaded</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="documents-body">
                    <tr>
                        <td colspan="6" class="placeholder" style="text-align:center;padding:24px">Loading documents...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/documents.js') }}"></script>
{% endblock %}
