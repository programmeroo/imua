[project]
name = "imua-mcp"
version = "0.5.0"
description = "MCP server for the Imua hub — exposes the Imua REST API as MCP tools (stdio transport)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "programmeroo" }]

dependencies = [
    # FastMCP first shipped in 1.2; mcp 2.x renamed it (mcp.server.mcpserver.MCPServer)
    # and removed mcp.server.fastmcp, so the server dies at import. Migrate before lifting.
    "mcp >= 1.2, < 2.0",
    "httpx >= 0.27",
    "pydantic >= 2.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "pytest-asyncio >= 0.23",
]

[project.scripts]
imua-mcp = "imua_mcp.server:main"

[build-system]
requires = ["setuptools >= 68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["imua_mcp*"]
